name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck analytics module
        run: npm run typecheck:analytics
      - name: Typecheck full project
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test -- --coverage
      - name: Upload coverage (lcov + json-summary)
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  bundle-size:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npm ci
      - name: Check bundle size
        run: |
          npm run check:bundle-size
          echo "Bundle size gate passed for ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  e2e-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run stable E2E smoke subset
        run: npx playwright test --project=chromium --grep @e2e-smoke
      - name: Upload E2E smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-smoke-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Summarize smoke
        if: always()
        run: echo "Search smoke suite completed for ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  a11y-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run stable accessibility smoke subset
        run: npx playwright test --project=chromium --grep @a11y-smoke
      - name: Upload a11y smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-a11y-smoke-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Summarize a11y
        if: always()
        run: echo "Accessibility smoke suite completed for ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
